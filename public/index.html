<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catch up</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --accent: #a78bfa;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        padding: 0 5vw 6vh;
        pointer-events: none;
      }

      .card {
        width: min(1040px, 100%);
        padding: 26px 34px 23px;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 14%);
        border-left: 6px solid var(--accent);
        border-radius: 16px;
        background: linear-gradient(130deg, rgb(14 18 29 / 97%), rgb(20 22 35 / 97%));
        box-shadow: 0 16px 54px rgb(0 0 0 / 54%), 0 0 34px rgb(167 139 250 / 18%);
        color: #f8f7ff;
        opacity: 0;
        transform: translateY(22px);
        transition: opacity 380ms ease, transform 380ms cubic-bezier(.2, .75, .25, 1);
      }

      .card.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .title {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 15px;
        color: #fff;
        font-size: 20px;
        font-weight: 760;
        letter-spacing: .01em;
      }

      .title::before {
        width: 10px;
        height: 10px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 14px rgb(167 139 250 / 75%);
        content: "";
      }

      .recap-rows {
        display: grid;
        gap: 0;
      }

      .recap-row {
        margin: 0;
        padding: 9px 0;
        color: #f3f2f8;
        font-size: clamp(22px, 2vw, 30px);
        font-weight: 560;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .recap-row + .recap-row {
        border-top: 1px solid rgb(255 255 255 / 10%);
      }

      .timer {
        height: 4px;
        margin: 18px -34px -23px;
        overflow: hidden;
        background: rgb(255 255 255 / 8%);
      }

      .timer-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), #67e8f9);
        transform: scaleX(1);
        transform-origin: left;
      }

      .timer-fill.running { animation: drain var(--duration, 15s) linear forwards; }

      @keyframes drain { to { transform: scaleX(0); } }

      @media (max-width: 700px) {
        .stage { padding: 0 18px 5vh; }
        .card { padding: 20px 22px 19px; }
        .timer { margin: 16px -22px -19px; }
        .title { font-size: 17px; }
        .recap-row { font-size: clamp(19px, 4vw, 24px); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-live="polite">
      <section id="card" class="card" aria-label="Stream recap" hidden>
        <h1 class="title">Catch up</h1>
        <div id="recap" class="recap-rows"></div>
        <div class="timer" aria-hidden="true"><div id="timer-fill" class="timer-fill"></div></div>
      </section>
    </main>
    <script>
      const card = document.getElementById("card");
      const recap = document.getElementById("recap");
      const timerFill = document.getElementById("timer-fill");
      const events = new EventSource("/events");
      let hideTimer;

      events.addEventListener("recap", (event) => {
        const { text, durationMs = 15000 } = JSON.parse(event.data);
        recap.replaceChildren();
        for (const line of text.split(/\r?\n/).filter(Boolean).slice(0, 4)) {
          const row = document.createElement("p");
          row.className = "recap-row";
          row.textContent = line;
          recap.append(row);
        }
        card.hidden = false;
        card.classList.remove("visible");
        timerFill.classList.remove("running");
        timerFill.style.setProperty("--duration", `${durationMs}ms`);
        void card.offsetWidth;
        card.classList.add("visible");
        timerFill.classList.add("running");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          card.classList.remove("visible");
          setTimeout(() => {
            if (!card.classList.contains("visible")) card.hidden = true;
          }, 280);
        }, durationMs);
      });
    </script>
  </body>
</html>
